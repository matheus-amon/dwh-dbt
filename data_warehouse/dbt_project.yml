name: "saas_metrics_dw"
version: "1.0.0"
config-version: 2

profile: "saas_metrics_dw"

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
clean-targets: ["target", "dbt_packages", "logs"]

vars:
  # The warehouse is built from a rolling 24-month window by the generator. The date spine
  # spans a little wider so period-over-period comparisons have a full prior year.
  date_spine_start_date: "2023-01-01"

  # Product catalog metadata: the lowest plan tier that can reach each feature. Mirrors the
  # plan catalogue in dwh-config-local, which is what gates telemetry at generation time.
  #
  # This coupling is real and deliberate but worth stating: without it, a gated feature reads
  # as 0% adoption on the tiers that cannot reach it, when the truth is that it is unreachable
  # there. Feature availability is product data, not warehouse data, so it lives here rather
  # than being inferred from the event stream.
  feature_min_tier:
    core: 0
    core_dashboard: 1
    data_export: 2
    api_access: 2
    sso: 3
    audit_log: 3
    advanced_analytics: 4

  # Account health scoring. Weights are configuration rather than constants because getting
  # these wrong is an argument with the revenue team, not a code change.
  #
  # Frequency is weighted above magnitude on purpose: the decline in usage is the early signal,
  # and revenue is the late one. An account losing engagement while still paying is the one
  # worth calling.
  health_weights:
    recency: 0.35
    frequency: 0.30
    trend: 0.20
    magnitude: 0.15

  # Weeks of silence after which an account counts as dormant rather than merely light.
  health_dormant_after_weeks: 4
  # Usage ratio against the previous four weeks below which an account is called declining
  # regardless of its overall score.
  health_declining_trend_ratio: 0.60

models:
  saas_metrics_dw:
    staging:
      +materialized: view
      +schema: staging
    core:
      +materialized: table
      +schema: core
      # The event fact grows with the telemetry stream; it does not need a full rebuild.
      facts:
        fct_product_events:
          +materialized: incremental
          +incremental_strategy: merge
          +unique_key: event_id
    marts:
      +materialized: table
      +schema: marts

snapshots:
  saas_metrics_dw:
    +schema: core

tests:
  saas_metrics_dw:
    +store_failures: true
    +schema: dbt_test_failures

flags:
  require_explicit_package_overrides_for_builtin_materializations: true
  source_freshness_run_project_hooks: false
