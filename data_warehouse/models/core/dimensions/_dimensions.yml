version: 2

models:
  - name: dim_date
    description: >
      One row per calendar day, generated by this project's own `generate_date_spine` macro
      rather than by dbt_date. Spans from `date_spine_start_date` to the build date, which is
      wider than the data window so period-over-period comparisons have a full prior period.
    columns:
      - name: sk_date
        description: Surrogate key.
        data_tests:
          - unique
          - not_null
      - name: date_day
        description: The day itself. Unique grain of the table.
        data_tests:
          - unique
          - not_null
      - name: month_start_date
        description: First day of the month. Join key for any month-grain measure.
        data_tests:
          - not_null
      - name: iso_day_of_week
        description: ISO day of week, 1 = Monday through 7 = Sunday.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 7
                inclusive: true
      - name: is_weekend
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: month_year
        description: Sortable 'YYYY-MM' label.
        data_tests:
          - not_null

  - name: dim_plans
    description: >
      Plan catalogue with surrogate keys. `tier_rank` is the ordering that feature gating and
      upgrade-versus-downgrade logic read, so nothing downstream compares plan names as
      strings.
    columns:
      - name: sk_plan
        data_tests:
          - unique
          - not_null
      - name: plan_code
        description: Natural key.
        data_tests:
          - unique
          - not_null
      - name: tier_rank
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 4
                inclusive: true
      - name: monthly_price_usd
        data_tests:
          - not_null
          - expect_non_negative

  - name: dim_accounts
    description: >
      Account dimension. Current-state attributes only — the history of plan tier, seats and
      status lives in the `snap_account_attributes` snapshot, which is what lets the
      subscription fact be reconstructed as-of any past date.
    columns:
      - name: sk_account
        description: Surrogate key used by every fact.
        data_tests:
          - unique
          - not_null
      - name: account_id
        description: Natural key from the source system.
        data_tests:
          - unique
          - not_null
      - name: signup_month
        description: Cohort anchor, shared with the retention mart.
        data_tests:
          - not_null
      - name: plan_code_at_signup
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_plans')
                field: plan_code
      - name: is_churned
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

  - name: dim_users
    description: >
      User dimension. Carries `fk_account` so user-grain facts join a surrogate key rather
      than the natural one.
    columns:
      - name: sk_user
        data_tests:
          - unique
          - not_null
      - name: user_id
        data_tests:
          - unique
          - not_null
      - name: fk_account
        description: Foreign key onto dim_accounts.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: sk_account
      - name: account_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: account_id
      - name: is_admin
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
