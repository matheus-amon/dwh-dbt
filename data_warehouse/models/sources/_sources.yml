version: 2

sources:
  - name: raw
    description: >
      Synthetic B2B SaaS data produced by
      [dwh-config-local](https://github.com/matheus-amon/dwh-config-local) and loaded into
      the `raw` schema by `telemetry-lab load`. These are the contract between that repo and
      this one; the column definitions are asserted from the tests below.
    schema: raw
    database: "{{ target.database }}"
    meta:
      owner: data-platform
      generator: dwh-config-local
    tables:
      - name: raw_plans
        description: Plan catalogue. One row per tier; static reference data.
        columns:
          - name: plan_code
            description: Stable key for the tier, such as `growth`.
            data_tests:
              - unique
              - not_null
          - name: plan_name
            description: Display name.
            data_tests:
              - not_null
          - name: monthly_price_usd
            description: List price per month at the included seat count.
            data_tests:
              - not_null
              - dbt_utils.accepted_range:
                  arguments:
                    min_value: 0
                    inclusive: false
          - name: included_seats
            description: Seats covered by the list price.
            data_tests:
              - not_null
              - dbt_utils.accepted_range:
                  arguments:
                    min_value: 0
                    inclusive: false
          - name: billing_interval
            description: Either `monthly` or `annual`.
            data_tests:
              - accepted_values:
                  arguments:
                    values: ["monthly", "annual"]
          - name: tier_rank
            description: >
              1-based ordering of the tiers. Feature gating and upgrade/downgrade direction both
              read this rather than comparing plan names.
            data_tests:
              - not_null
              - dbt_utils.accepted_range:
                  arguments:
                    min_value: 1
                    max_value: 4
                    inclusive: true

      - name: raw_accounts
        description: >
          B2B customer master. One row per account, holding current attributes; the history of
          those attributes lives in the account attribute snapshot.
        loaded_at_field: signed_up_at
        freshness:
          warn_after: {count: 48, period: hour}
          error_after: {count: 72, period: hour}
        columns:
          - name: account_id
            description: Natural key of the account.
            data_tests:
              - unique
              - not_null
          - name: account_name
            data_tests:
              - not_null
          - name: domain
            data_tests:
              - not_null
          - name: industry
            data_tests:
              - not_null
          - name: employee_band
            description: Company size bucket, such as `51-200`.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["1-10", "11-50", "51-200", "201-1000", "1000+"]
          - name: country_code
            description: ISO 3166-1 alpha-2, restricted to the generator's country catalogue.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["US", "CA", "GB", "DE", "NL", "SE", "IE", "BR", "MX", "SG", "AU", "JP"]
          - name: region
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["North America", "EMEA", "LATAM", "APAC"]
          - name: signed_up_at
            description: When the account first appeared. Cohort anchor for the retention mart.
            data_tests:
              - not_null
          - name: plan_code_at_signup
            description: Tier the account signed up on.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source("raw", "raw_plans")
                    field: plan_code
          - name: seats
            description: Current seat count.
            data_tests:
              - not_null
              - dbt_utils.accepted_range:
                  arguments:
                    min_value: 0
                    inclusive: false
          - name: status
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["active", "churned"]
          - name: churned_at
            description: Null while the account is active.

      - name: raw_users
        description: People inside accounts. Exactly one admin per account by construction.
        loaded_at_field: created_at
        freshness:
          warn_after: {count: 48, period: hour}
          error_after: {count: 72, period: hour}
        columns:
          - name: user_id
            data_tests:
              - unique
              - not_null
          - name: account_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source("raw", "raw_accounts")
                    field: account_id
          - name: email
            data_tests:
              - unique
              - not_null
          - name: full_name
            data_tests:
              - not_null
          - name: role
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["admin", "member", "analyst", "viewer"]
          - name: is_admin
            data_tests:
              - not_null
          - name: created_at
            data_tests:
              - not_null
          - name: last_seen_at
            description: Last activity timestamp. The recency input to the health mart.

      - name: raw_subscriptions
        description: >
          One row per uninterrupted period an account spent on a single plan. An upgrade or
          downgrade closes a row and opens the next; a churn closes one for good. This shape is
          what makes new / expansion / contraction / churned MRR derivable.
        loaded_at_field: started_at
        freshness:
          warn_after: {count: 48, period: hour}
          error_after: {count: 72, period: hour}
        columns:
          - name: subscription_id
            data_tests:
              - unique
              - not_null
          - name: account_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source("raw", "raw_accounts")
                    field: account_id
          - name: plan_code
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source("raw", "raw_plans")
                    field: plan_code
          - name: billing_interval
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["monthly", "annual"]
          - name: seats
            data_tests:
              - not_null
              - dbt_utils.accepted_range:
                  arguments:
                    min_value: 0
                    inclusive: false
          - name: discount_pct
            data_tests:
              - not_null
              - dbt_utils.accepted_range:
                  arguments:
                    min_value: 0
                    max_value: 100
          - name: mrr_usd
            data_tests:
              - not_null
              - expect_non_negative
          - name: started_at
            data_tests:
              - not_null
          - name: ended_at
            description: Null while the term is current.
          - name: ended_reason
            description: Null while the term is current.
            data_tests:
              - accepted_values:
                  arguments:
                    values: ["upgraded", "downgraded", "churned"]
                  config:
                    where: "ended_reason is not null"

      - name: raw_product_events
        description: >
          Product telemetry. One row per action taken in the product. Largest table in the
          warehouse and the only incremental one.
        loaded_at_field: event_ts
        freshness:
          warn_after: {count: 12, period: hour}
          error_after: {count: 24, period: hour}
        columns:
          - name: event_id
            description: >
              Unique per event and monotonically increasing with event_ts, which is what lets
              the incremental fact merge safely on it.
            data_tests:
              - unique
              - not_null
          - name: account_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source("raw", "raw_accounts")
                    field: account_id
          - name: user_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source("raw", "raw_users")
                    field: user_id
          - name: event_name
            data_tests:
              - not_null
          - name: feature
            description: >
              Product area the event belongs to. `core` covers the un-gated actions
              (`app_opened`, `integration_connected`); the rest are gated by plan tier, so an
              adoption metric on a gated feature is measuring adoption and not plan mix.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - core
                      - core_dashboard
                      - data_export
                      - api_access
                      - sso
                      - audit_log
                      - advanced_analytics
          - name: platform
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["web", "ios", "android", "api"]
          - name: session_id
            description: Groups events within one account-day. The weekly usage fact counts these.
            data_tests:
              - not_null
          - name: country_code
            description: ISO 3166-1 alpha-2, inherited from the account.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["US", "CA", "GB", "DE", "NL", "SE", "IE", "BR", "MX", "SG", "AU", "JP"]
          - name: event_ts
            data_tests:
              - not_null
          - name: event_date
            data_tests:
              - not_null
