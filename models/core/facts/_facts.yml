version: 2

models:
  - name: fct_subscription_periods
    description: >
      The central revenue fact. One row per account per month, holding the MRR in force at
      month end and the movement flags derived by comparing against the previous month.

      A plan change mid-month does not produce two rows: the term in force at month end wins,
      and `terms_in_month` records that more than one term touched the month. Movement
      classification lives here rather than in the mart so every consumer reads it the same
      way.
    columns:
      - name: sk_subscription_period
        description: Surrogate key over account and month.
        data_tests:
          - unique
          - not_null
      - name: fk_account
        description: Foreign key onto dim_accounts.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: sk_account
      - name: account_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: account_id
      - name: month_start_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: fk_plan
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_plans')
                field: sk_plan
      - name: plan_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_plans')
                field: plan_code
      - name: tenure_month_number
        description: >
          1 in the account's first month, incrementing monthly. This is the cohort offset the
          retention mart groups by.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: mrr_usd
        description: MRR in force at month end.
        data_tests:
          - not_null
          - expect_non_negative
      - name: prior_mrr_usd
        description: MRR in force at the end of the previous month. Null in the first month.
      - name: mrr_change_usd
        description: >
          Movement against the previous month. Negative during a contraction, so no range
          test here; expect_non_negative applies to the measures, not to the deltas.
      - name: is_first_month
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: is_churned_month
        description: >
          The account's term closed with a churn inside this month. The month is still
          counted as active, and the mart subtracts it from the closing balance of this month
          and every month after, which is why an account has no rows once it has churned.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: is_expansion
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: is_contraction
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

  - name: fct_product_events
    description: >
      Product telemetry at event grain. The only incremental model in the warehouse:
      configured in dbt_project.yml with `merge` on `event_id`.

      The incremental filter is a one-day lookback from the high-water mark rather than a
      strict `> max(event_ts)`, because event ids increase with time and the merge is keyed
      on event_id, so re-reading a day is idempotent. Without it, an event whose timestamp is
      slightly behind the high-water mark would be dropped forever.
    columns:
      - name: event_id
        description: Unique per event and monotonic with event_ts.
        data_tests:
          - unique
          - not_null
      - name: fk_account
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: sk_account
      - name: fk_user
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_users')
                field: sk_user
      - name: fk_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: sk_date
      - name: event_ts
        data_tests:
          - not_null
      - name: feature
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - core
                  - core_dashboard
                  - data_export
                  - api_access
                  - sso
                  - audit_log
                  - advanced_analytics
      - name: platform
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["web", "ios", "android", "api"]
      - name: session_id
        data_tests:
          - not_null
      - name: days_since_spine_start
        description: >
          Monotonic ordering key. Incremental runs select on event_ts; this makes the
          relationship to the date spine explicit for anything ordering by the spine.
        data_tests:
          - expect_non_negative

  - name: fct_account_weekly_usage
    description: >
      Weekly product usage per account, aggregated from the event fact. This is where the
      decline-before-churn behaviour becomes visible: `event_count` trending down over the
      weeks before a cancellation is the signal `mart_account_health` ranks accounts on.

      One row per account per week that had at least one event. A silent week is an absence
      rather than a zero row, and the health mart reads that difference deliberately.
    columns:
      - name: sk_account_week
        data_tests:
          - unique
          - not_null
      - name: fk_account
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: sk_account
      - name: account_id
        data_tests:
          - not_null
      - name: week_start_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: month_start_date
        description: >
          The month this week falls in. Carried so the health mart can join weekly usage to
          MRR without going back to the calendar.
        data_tests:
          - not_null
      - name: event_count
        data_tests:
          - not_null
          - expect_non_negative
      - name: session_count
        data_tests:
          - not_null
          - expect_non_negative
      - name: active_user_count
        data_tests:
          - not_null
          - expect_non_negative
      - name: is_active_week
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: api_event_share
        description: >
          Share of the week's events on the API platform. NULL rather than 0 for a week with no
          events, per the safe_divide convention.
